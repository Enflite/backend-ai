services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai
      # WARNING: dev-only placeholder. In production, provide a securely generated secret (>=32 chars).
      JWT_SECRET: dev-only-secret-do-not-use-in-production-min-32-chars
      JWT_EXPIRES_IN: 8h
      VLLM_BASE_URL: http://vllm:8000/v1
      VLLM_MODEL: meta-llama/Meta-Llama-3.1-8B-Instruct
      DEV_AUTH_ENABLED: "true"
      NODE_ENV: development
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    command: sh -c "npm ci && npm run migrate && npm run dev"

  vllm:
    profiles:
      - "gpu"
    image: vllm/vllm-openai:latest
    command: ["--model", "${VLLM_MODEL:-meta-llama/Meta-Llama-3.1-8B-Instruct}"]
    ports:
      - "8000:8000"

volumes:
  pgdata:
