# Development-only Compose file.
#
# The default values below are LOCAL DEVELOPMENT PLACEHOLDERS ONLY. Any literal
# credential previously committed to this file must be treated as compromised:
# rotate it in every environment where it was used and never reuse it.
# For shared, staging, or production deployments, override every secret via the
# environment or a secret manager (see backend/.env.example and
# docs/deployment.md). Production must also set NODE_ENV=production,
# COOKIE_SECURE=true, MALWARE_SCAN_MODE=http with MALWARE_SCANNER_ENDPOINT, an
# explicit CORS_ORIGIN, and a high-entropy JWT_SECRET (>= 32 chars).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai}
      # Dev-only placeholder default. Override JWT_SECRET in any non-local
      # environment; the checked-in default must never be used beyond local dev.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-do-not-use-in-production-min-32-chars}
      JWT_EXPIRES_IN: 15m
      # Model endpoints come from the model registry (models.endpoint), not env.
      # Dev-only convenience. config.ts refuses to boot with DEV_AUTH_ENABLED=true
      # when NODE_ENV=production.
      DEV_AUTH_ENABLED: "true"
      NODE_ENV: development
      PORT: 8080
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-enflite-ai-documents}
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-dev-minio-user}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dev-minio-password-change-me}
      MALWARE_SCAN_MODE: disabled-development
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    command: sh -c "npm ci && npm run migrate && npm run dev"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      # Dev-only placeholder defaults; override MINIO_ROOT_USER /
      # MINIO_ROOT_PASSWORD in the environment for any non-local use.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dev-minio-user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-minio-password-change-me}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - objectdata:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-dev-minio-user}" "${MINIO_ROOT_PASSWORD:-dev-minio-password-change-me}" &&
        mc mb --ignore-existing "local/${OBJECT_STORAGE_BUCKET:-enflite-ai-documents}"

  vllm:
    profiles:
      - "gpu"
    image: vllm/vllm-openai:latest
    command: ["--model", "${VLLM_MODEL:-meta-llama/Meta-Llama-3.1-8B-Instruct}"]
    ports:
      - "8000:8000"

volumes:
  pgdata:
  objectdata:
