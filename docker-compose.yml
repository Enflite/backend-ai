services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai
      # WARNING: dev-only placeholder. In production, provide a securely generated secret (>=32 chars).
      JWT_SECRET: dev-only-secret-do-not-use-in-production-min-32-chars
      JWT_EXPIRES_IN: 8h
      VLLM_BASE_URL: http://vllm:8000/v1
      VLLM_MODEL: meta-llama/Meta-Llama-3.1-8B-Instruct
      DEV_AUTH_ENABLED: "true"
      NODE_ENV: development
      PORT: 8080
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: enflite-ai-documents
      OBJECT_STORAGE_ACCESS_KEY: dev-minio-user
      OBJECT_STORAGE_SECRET_KEY: dev-minio-password-change-me
      MALWARE_SCAN_MODE: disabled-development
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    command: sh -c "npm ci && npm run migrate && npm run dev"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dev-minio-user
      MINIO_ROOT_PASSWORD: dev-minio-password-change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - objectdata:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 dev-minio-user dev-minio-password-change-me &&
        mc mb --ignore-existing local/enflite-ai-documents

  vllm:
    profiles:
      - "gpu"
    image: vllm/vllm-openai:latest
    command: ["--model", "${VLLM_MODEL:-meta-llama/Meta-Llama-3.1-8B-Instruct}"]
    ports:
      - "8000:8000"

volumes:
  pgdata:
  objectdata:
